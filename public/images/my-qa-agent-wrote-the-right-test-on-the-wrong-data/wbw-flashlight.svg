<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <rect x="4" y="4" width="812" height="432" rx="14" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <!-- the dark region (left) -->
  <path d="M22,24 q120,-8 218,6 q14,90 8,190 q6,110 -6,196 q-110,10 -220,0 q-8,-100 -2,-196 q-6,-100 2,-196 Z"
        fill="#e2e2e2" stroke="#bbbbbb" stroke-width="2" stroke-linejoin="round"/>
  <text x="46" y="58" font-size="15" fill="#777777" transform="rotate(-1 46 58)">NOT IN THE DIFF</text>
  <text x="46" y="80" font-size="12.5" fill="#999999">(no light reaches here)</text>

  <!-- pruner box in the dark -->
  <path d="M52,150 q66,-5 138,0 q6,52 0,104 q-72,6 -138,0 q-6,-52 0,-104 Z"
        fill="#d3d3d3" stroke="#888888" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="102" cy="188" r="3.4" fill="#ffffff"/>
  <circle cx="134" cy="188" r="3.4" fill="#ffffff"/>
  <path d="M100,212 q18,6 36,0" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="64" y="286" font-size="15" fill="#555555" transform="rotate(-1 64 286)">THE PRUNER</text>
  <text x="46" y="308" font-size="12.5" fill="#777777">still trusting the row counts,</text>
  <text x="46" y="326" font-size="12.5" fill="#777777">which just stopped being true</text>

  <!-- the model stick figure -->
  <circle cx="320" cy="176" r="17" fill="#ffffff" stroke="#222222" stroke-width="2.6"/>
  <circle cx="326" cy="172" r="1.8" fill="#222222"/>
  <circle cx="315" cy="172" r="1.8" fill="#222222"/>
  <path d="M315,184 q6,4 13,1" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M320,193 q-2,40 0,64" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M320,210 q-18,12 -26,26" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M320,208 q26,-4 44,-10" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M320,257 q-12,26 -18,40" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M320,257 q12,26 18,40" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <text x="272" y="330" font-size="15" fill="#222222" transform="rotate(-1 272 330)">THE MODEL</text>
  <text x="252" y="352" font-size="12.5" fill="#666666">(auditing very hard, one way)</text>

  <!-- flashlight -->
  <rect x="362" y="188" width="30" height="14" rx="4" fill="#ffffff" stroke="#222222" stroke-width="2.4" transform="rotate(-3 377 195)"/>
  <!-- floodlit region -->
  <path d="M436,34 q180,-14 348,8 q16,178 0,368 q-168,16 -348,4 q-14,-188 0,-380 Z" fill="#fff3bf" opacity="0.7" stroke="#e6c34a" stroke-width="2"/>
  <g stroke="#e6c34a" stroke-width="2.4" stroke-linecap="round">
    <path d="M398,182 q22,-16 40,-26"/>
    <path d="M402,192 q24,-4 44,-6"/>
    <path d="M402,202 q24,6 44,12"/>
    <path d="M398,210 q22,18 38,30"/>
  </g>
  <text x="642" y="60" font-size="13.5" fill="#a8871f" transform="rotate(-0.6 642 60)">IN THE DIFF (floodlit)</text>

  <!-- boxes in the light -->
  <g>
    <path d="M470,96 q76,-5 150,0 q5,24 0,48 q-74,5 -150,0 q-5,-24 0,-48 Z" fill="#ffffff" stroke="#222222" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="486" y="126" font-size="14.5" fill="#222222">the new mask code</text>
    <path d="M636,112 l8,10 l16,-18" fill="none" stroke="#3f9e63" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M486,168 q76,-4 150,0 q5,24 0,48 q-74,4 -150,0 q-5,-24 0,-48 Z" fill="#ffffff" stroke="#222222" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="510" y="198" font-size="14.5" fill="#222222">path 1: hooked</text>
    <path d="M652,184 l8,10 l16,-18" fill="none" stroke="#3f9e63" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M498,240 q76,-4 150,0 q5,24 0,48 q-74,4 -150,0 q-5,-24 0,-48 Z" fill="#ffffff" stroke="#222222" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="522" y="270" font-size="14.5" fill="#222222">path 2: hooked</text>
    <path d="M664,256 l8,10 l16,-18" fill="none" stroke="#3f9e63" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <path d="M506,312 q80,-4 158,0 q5,24 0,48 q-78,4 -158,0 q-5,-24 0,-48 Z" fill="#ffffff" stroke="#222222" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="520" y="336" font-size="13.5" fill="#222222">join path: found a real</text>
    <text x="520" y="354" font-size="13.5" fill="#222222">gap! (good work, honestly)</text>
  </g>

  <text x="470" y="408" font-size="14" fill="#666666" transform="rotate(-0.5 470 408)">every box in the light got line level scrutiny</text>
</svg>

