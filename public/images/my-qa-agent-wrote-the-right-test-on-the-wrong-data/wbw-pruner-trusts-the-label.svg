<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <!-- card -->
  <rect x="4" y="4" width="772" height="462" rx="14" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <!-- speech bubble -->
  <path d="M38,52 q-8,-26 24,-30 q90,-10 180,-2 q34,3 30,30 q4,44 -6,62 q-4,20 -32,20 q-80,8 -164,0 q-30,-2 -30,-26 q-8,-30 -2,-54 Z"
        fill="#ffffff" stroke="#222222" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M120,132 q-4,22 -18,34 q26,-8 40,-30" fill="#ffffff" stroke="#222222" stroke-width="2.6" stroke-linejoin="round"/>
  <text x="58" y="62" font-size="17" fill="#222222" transform="rotate(-0.6 58 62)">Need 50 rows.</text>
  <text x="58" y="86" font-size="17" fill="#222222" transform="rotate(0.4 58 86)">This box says 55.</text>
  <text x="58" y="110" font-size="17" fill="#222222" transform="rotate(-0.5 58 110)">One box is plenty!</text>

  <!-- pruner stick figure -->
  <circle cx="120" cy="212" r="17" fill="#ffffff" stroke="#222222" stroke-width="2.6"/>
  <circle cx="114" cy="209" r="1.8" fill="#222222"/>
  <circle cx="126" cy="209" r="1.8" fill="#222222"/>
  <path d="M113,220 q7,5 14,0" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M120,229 q-2,38 0,62" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M120,246 q-20,10 -30,26" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M120,244 q24,4 40,-6" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M120,291 q-12,26 -20,40" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M120,291 q12,26 18,40" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <!-- clipboard -->
  <rect x="156" y="222" width="30" height="40" rx="3" fill="#ffffff" stroke="#222222" stroke-width="2.4" transform="rotate(8 171 242)"/>
  <path d="M162,236 l18,2 M161,245 l18,2 M160,254 l14,2" stroke="#222222" stroke-width="1.6" stroke-linecap="round"/>
  <text x="78" y="360" font-size="16" fill="#222222" transform="rotate(-1 78 360)">THE PRUNER</text>
  <text x="60" y="381" font-size="12.5" fill="#666666">(only ever reads the label)</text>

  <!-- segment box -->
  <path d="M300,168 q80,-5 168,0 q6,90 0,182 q-88,6 -168,0 q-6,-92 0,-182 Z"
        fill="#ffffff" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
  <!-- sticky label -->
  <rect x="306" y="138" width="160" height="50" rx="4" fill="#fff3bf" stroke="#222222" stroke-width="2.2" transform="rotate(-2 386 163)"/>
  <text x="322" y="160" font-size="17" fill="#222222" transform="rotate(-2 322 160)">55 ROWS</text>
  <text x="322" y="180" font-size="11.5" fill="#8a6d1a" transform="rotate(-2 322 180)">(printed at build time)</text>

  <!-- rows inside: 11 rows, 6 struck -->
  <g stroke="#222222" stroke-width="2" stroke-linecap="round">
    <path d="M318,196 q66,2 132,0"/>
    <path d="M318,210 q66,-2 132,0"/>
    <path d="M318,224 q66,2 132,0"/>
    <path d="M318,238 q66,-2 132,0"/>
    <path d="M318,252 q66,2 132,0"/>
    <path d="M318,266 q66,-2 132,0"/>
    <path d="M318,280 q66,2 132,0"/>
    <path d="M318,294 q66,-2 132,0"/>
    <path d="M318,308 q66,2 132,0"/>
    <path d="M318,322 q66,-2 132,0"/>
    <path d="M318,336 q66,2 132,0"/>
  </g>
  <g stroke="#d64545" stroke-width="2.6" stroke-linecap="round">
    <path d="M312,262 q70,6 144,2"/>
    <path d="M312,276 q70,4 144,2"/>
    <path d="M312,290 q70,6 144,2"/>
    <path d="M312,304 q70,4 144,2"/>
    <path d="M312,318 q70,6 144,2"/>
    <path d="M312,332 q70,4 144,2"/>
  </g>
  <!-- mask note -->
  <path d="M352,398 q4,-24 6,-40" fill="none" stroke="#d64545" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M358,358 l-8,10 M358,358 l4,12" stroke="#d64545" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <text x="252" y="420" font-size="14" fill="#d64545" transform="rotate(-1 252 420)">deleted by the mask</text>
  <text x="252" y="440" font-size="12.5" fill="#d64545">(invisible from out here)</text>

  <!-- arrow to answer -->
  <path d="M478,220 q60,-12 118,-4" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M596,216 l-14,-7 M596,216 l-12,10" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>

  <!-- answer box -->
  <path d="M606,182 q62,-4 128,0 q5,32 0,64 q-66,5 -128,0 q-5,-32 0,-64 Z"
        fill="#ffffff" stroke="#222222" stroke-width="2.8" stroke-linejoin="round"/>
  <text x="626" y="212" font-size="16" fill="#222222">THE ANSWER</text>
  <text x="640" y="236" font-size="17" fill="#d64545" transform="rotate(-1 640 236)">25 rows</text>

  <!-- user stick figure -->
  <circle cx="672" cy="308" r="15" fill="#ffffff" stroke="#222222" stroke-width="2.6"/>
  <circle cx="666" cy="305" r="1.7" fill="#222222"/>
  <circle cx="678" cy="305" r="1.7" fill="#222222"/>
  <path d="M666,316 q6,-4 12,0" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M672,323 q-2,32 0,52" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M672,338 q-16,8 -24,20 M672,338 q16,8 24,20" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M672,375 q-10,22 -16,34 M672,375 q10,22 16,34" fill="none" stroke="#222222" stroke-width="2.6" stroke-linecap="round"/>
  <text x="548" y="330" font-size="15" fill="#222222" transform="rotate(-1 548 330)">...I asked</text>
  <text x="548" y="350" font-size="15" fill="#222222" transform="rotate(-1 548 350)">for 50.</text>
</svg>

