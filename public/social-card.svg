<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Kartik Khare engineering notes</title>
  <desc id="description">A dark terminal-inspired card for writing about distributed systems, databases and AI agents.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#183018" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#090b10"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.7"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#2c4729" stroke-width="2"/>
  <path d="M42 102H1158" stroke="#2c4729" stroke-width="2"/>
  <circle cx="78" cy="72" r="7" fill="#39ff14" filter="url(#glow)"/>
  <circle cx="104" cy="72" r="7" fill="#00e5cc" opacity="0.75"/>
  <circle cx="130" cy="72" r="7" fill="#ffb300" opacity="0.75"/>
  <text x="168" y="81" fill="#6a8a5a" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="23" letter-spacing="3">KARTIK@SITE:~/NOTES$</text>
  <text x="94" y="255" fill="#f0f0f0" font-family="DejaVu Sans, sans-serif" font-size="88" font-weight="700">Kartik Khare</text>
  <rect x="98" y="286" width="176" height="8" fill="#39ff14" filter="url(#glow)"/>
  <text x="96" y="370" fill="#c8c8c8" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="34">distributed systems / databases / ai agents</text>
  <text x="96" y="505" fill="#6a8a5a" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="26" letter-spacing="2">KHAREKARTIK.DEV</text>
  <text x="1068" y="520" fill="#39ff14" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="42">▮</text>
</svg>
